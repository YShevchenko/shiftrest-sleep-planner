name: shiftrest_app
description: "Schedule-driven sleep planner for shift workers."
publish_to: 'none'
version: 1.0.10+10

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  provider: ^6.1.5
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  wakelock_plus: ^1.2.8
  uuid: ^4.5.1
  shared_preferences: ^2.5.3
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  in_app_purchase: ^3.2.0
  audioplayers: ^6.1.0
  health: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/white_noise.mp3
    - assets/sounds/brown_noise.mp3
    - assets/sounds/pink_noise.mp3

flutter_native_splash:
  color: "#312E81"
  android: true
  ios: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
